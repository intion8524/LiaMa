<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BossList Offline</title>
<style>
/* ===== Theme Variables ===== */
:root, body.theme-light {
    --bg: #f0f2f5; --card: #ffffff; --card-alt: #f8f9fa;
    --border: #e0e0e0; --text: #333; --text-muted: #888;
    --text-faint: #aaa; --accent: #4a90d9;
    --accent-light: rgba(74,144,217,0.1);
    --danger: #e74c3c; --danger-bg: #fff5f5;
    --purple: #9b59b6; --purple-bg: #faf5ff;
    --success: #4caf7a; --shadow: rgba(0,0,0,0.08);
}
body.theme-kiro {
    --bg: #1b1e2b; --card: #232738; --card-alt: #2a2e42;
    --border: #3a3f55; --text: #e0e4f0; --text-muted: #8890a8;
    --text-faint: #5a6080; --accent: #6c9fff;
    --accent-light: rgba(108,159,255,0.12);
    --danger: #ff6b6b; --danger-bg: #2e1a1a;
    --purple: #a78bfa; --purple-bg: #1e1a2e;
    --success: #4ade80; --shadow: rgba(0,0,0,0.3);
}
body.theme-gold {
    --bg: #1a1c24; --card: #1e2028; --card-alt: #2a2d35;
    --border: #3a3d48; --text: #e0d5c0; --text-muted: #8b7a5e;
    --text-faint: #5a5040; --accent: #d4a84b;
    --accent-light: rgba(212,168,75,0.12);
    --danger: #ff4444; --danger-bg: #2e1515;
    --purple: #9b59b6; --purple-bg: #1e1a2a;
    --success: #4caf7a; --shadow: rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 12px; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
.container { max-width: 900px; margin: auto; }

/* Header */
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.header h1 { font-size: 1.2em; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tool-btn {
    padding: 5px 12px; border-radius: 20px; cursor: pointer;
    border: 1.5px solid var(--border); color: var(--text-muted);
    font-size: 12px; font-weight: 600; user-select: none; transition: all 0.15s;
    background: none;
}
.tool-btn:hover { border-color: var(--accent); color: var(--accent); }
.tool-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

/* EP Filter */
.ep-filter { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.ep-chip {
    padding: 4px 10px; border-radius: 16px; font-size: 11px; font-weight: 600;
    border: 1.5px solid var(--border); color: var(--text-muted); cursor: pointer;
    user-select: none; transition: all 0.15s;
}
.ep-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
/* Grid */
.grid-section { margin-bottom: 14px; }
.grid-header { font-size: 13px; font-weight: 700; color: var(--text); padding: 6px 0; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
.grid-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 4px; }
.grid-cell {
    background: var(--card-alt); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 6px 4px; text-align: center; cursor: pointer; transition: all 0.15s;
    min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
}
.grid-cell:hover { border-color: var(--accent); transform: translateY(-1px); }
.grid-cell .gc-map { font-size: 17px; font-weight: 800; color: var(--text); }
.grid-cell .gc-stars { font-size: 11px; margin-top: 2px; letter-spacing: 1px; }
.grid-cell .gc-fade { font-size: 9px; color: var(--text-muted); }
.grid-cell .gc-time { font-size: 11px; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.grid-cell .gc-heart { position: absolute; top: 2px; right: 4px; font-size: 10px; }
.grid-cell.gc-active { border-color: var(--accent); background: var(--card); }
.grid-cell.gc-fade4 { border-color: #f5c842; background: rgba(245,200,66,0.08); box-shadow: 0 0 12px rgba(245,200,66,0.3), inset 0 0 8px rgba(245,200,66,0.05); }
.grid-cell.gc-fade4 .gc-map { color: #f5c842; }
.grid-cell.gc-fade4 .gc-time { color: #f5c842; }
.grid-cell.gc-bosson { border-color: var(--danger); background: var(--danger-bg); }
.grid-cell.gc-bosson .gc-map { color: var(--danger); }
.grid-cell.gc-dead { border-color: var(--purple); background: var(--purple-bg); }
.grid-cell.gc-dead .gc-map { color: var(--purple); }
.grid-cell.gc-waiting { opacity: 0.4; }
.grid-add { width: 100%; margin-top: 4px; padding: 3px; text-align: center; font-size: 14px; color: var(--text-faint); border: 1.5px dashed var(--border); border-radius: 8px; cursor: pointer; }
.grid-add:hover { border-color: var(--accent); color: var(--accent); }
/* Bottom Sheet */
#bsOverlay { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.5); display: none; }
#bsOverlay.open { display: block; }
#bottomSheet {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95);
    z-index: 10000; background: var(--card); border: 2px solid var(--accent);
    border-radius: 18px; padding: 16px; width: 90%; max-width: 420px;
    max-height: 80vh; overflow-y: auto; transition: transform 0.25s, opacity 0.25s;
    box-shadow: 0 8px 40px var(--shadow); opacity: 0; pointer-events: none;
}
#bottomSheet.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
.bs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.bs-title { font-size: 15px; font-weight: 700; }
.bs-close { font-size: 20px; color: var(--text-muted); cursor: pointer; padding: 4px 8px; }
.bs-section { margin-bottom: 14px; }
.bs-section-title { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.bs-btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
.bs-btn { padding: 6px 12px; border: 1.5px solid var(--border); border-radius: 10px; background: none; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.bs-btn:active { transform: scale(0.95); }
.bs-btn.bs-on { border-color: var(--danger); color: var(--danger); }
.bs-btn.bs-dead { border-color: var(--purple); color: var(--purple); }
.bs-btn.bs-delete { border-color: var(--danger); color: var(--danger); }
.bs-status-wrap { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.bs-status-group { display: flex; gap: 6px; }
.bs-star-row { display: flex; align-items: flex-end; justify-content: center; gap: 10px; padding: 12px 0; }
.bs-star { cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.bs-star .star-icon { transition: all 0.15s; }
.bs-star .star-icon.big { font-size: 38px; color: var(--border); }
.bs-star .star-icon.small { font-size: 24px; color: var(--border); }
.bs-star .star-icon.active { color: #f5c842; filter: drop-shadow(0 0 4px rgba(245,200,66,0.6)); }
.bs-star .star-label { font-size: 9px; color: var(--text-faint); }
.bs-star:hover .star-icon { transform: scale(1.2); }
.bs-input-row { display: flex; gap: 8px; margin-top: 8px; }
.bs-input-row input { flex: 1; padding: 8px 12px; border: 1.5px solid var(--accent); border-radius: 10px; background: var(--card-alt); color: var(--text); font-size: 14px; outline: none; }
.bs-input-row button { padding: 8px 16px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
/* Setup Modal */
#setupModal { position: fixed; inset: 0; z-index: 20000; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; }
#setupModal.open { display: flex; }
.setup-content { background: var(--card); border-radius: 16px; padding: 20px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 40px var(--shadow); }
.setup-content h2 { margin-bottom: 12px; font-size: 16px; }
.setup-ep { margin-bottom: 14px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; }
.setup-ep-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.setup-ep-header input { width: 120px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--card-alt); color: var(--text); font-size: 13px; }
.setup-map-row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.setup-map-row input { padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--card-alt); color: var(--text); font-size: 12px; }
.setup-map-row input.map-num { width: 50px; }
.setup-map-row input.map-name { flex: 1; }
.setup-btn { padding: 4px 10px; border: 1px dashed var(--border); border-radius: 6px; background: none; color: var(--text-muted); font-size: 11px; cursor: pointer; }
.setup-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Scroll buttons */
.scroll-btns { position: fixed; right: 12px; bottom: 20px; z-index: 8000; display: flex; flex-direction: column; gap: 6px; }
.scroll-btns button { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.12); color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body class="theme-kiro">
<div class="container">
    <div class="header">
        <h1>🏴‍☠️ BossList</h1>
        <div style="display:flex;gap:6px;">
            <button class="tool-btn" onclick="openSetup()">⚙️ Setup</button>
            <button class="tool-btn" onclick="cycleTheme()" id="themeBtn">🌙 Kiro</button>
        </div>
    </div>
    <div class="toolbar">
        <button class="tool-btn active" id="viewBtn" onclick="toggleView()">⊞ Grid</button>
    </div>
    <div class="ep-filter" id="epFilter"></div>
    <div id="content"></div>
</div>

<!-- Bottom Sheet -->
<div id="bsOverlay" onclick="closeBS()"></div>
<div id="bottomSheet">
    <div class="bs-header">
        <span class="bs-title" id="bsTitle">—</span>
        <span class="bs-close" onclick="closeBS()">✕</span>
    </div>
    <div class="bs-section">
        <div class="bs-section-title">สถานะ</div>
        <div id="bsStatus"></div>
    </div>
    <div class="bs-section">
        <div class="bs-section-title">เฟด</div>
        <div class="bs-star-row" id="bsStars"></div>
    </div>
    <div class="bs-section">
        <div class="bs-section-title">ตั้งเวลาเกิดใหม่</div>
        <div class="bs-input-row">
            <input type="text" id="bsTimeInput" placeholder="เช่น 1.20 = 1ชม.20นาที หรือ 30" onkeydown="if(event.key==='Enter')bsSetTime()">
            <button onclick="bsSetTime()">ตั้งเวลา</button>
        </div>
    </div>
    <div id="bsDeleteWrap" class="bs-section">
        <button class="bs-btn bs-delete" onclick="bsDelete()">🗑️ ลบ CH</button>
    </div>
</div>

<!-- Setup Modal -->
<div id="setupModal" onclick="if(event.target===this)closeSetup()">
    <div class="setup-content">
        <h2>⚙️ ตั้งค่า EP & แมพ</h2>
        <div id="setupList"></div>
        <button class="setup-btn" onclick="addEP()" style="margin-top:10px;">+ เพิ่ม EP</button>
        <div style="text-align:right;margin-top:14px;">
            <button class="bs-btn" onclick="saveSetup()" style="border-color:var(--success);color:var(--success);padding:8px 20px;">💾 บันทึก</button>
        </div>
    </div>
</div>

<!-- Scroll buttons -->
<div class="scroll-btns">
    <button onclick="window.scrollTo({top:0,behavior:'smooth'})">▲</button>
    <button onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">▼</button>
</div>
<script>
// ===== Storage =====
const KEYS = { config: 'appConfig', bossList: 'appBossList', favs: 'appFavs', theme: 'appTheme', epFilter: 'appEpFilter' };
function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; } }
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

// ===== Config (EP & Maps) =====
let config = load(KEYS.config, [
    { name: 'EP 9', maps: [{num:75,name:''},{num:76,name:''},{num:77,name:''},{num:78,name:''},{num:79,name:''}] },
    { name: 'EP10', maps: [{num:80,name:''},{num:81,name:''},{num:82,name:''},{num:83,name:''}] },
    { name: 'EP11', maps: [{num:85,name:''},{num:86,name:''},{num:87,name:''},{num:88,name:''},{num:89,name:''}] },
    { name: 'EP12', maps: [{num:90,name:''},{num:91,name:''},{num:92,name:''},{num:93,name:''}] },
    { name: 'EP13', maps: [{num:95,name:''},{num:98,name:''},{num:101,name:''},{num:103,name:''}] },
    { name: 'EP14', maps: [{num:105,name:''},{num:107,name:''},{num:109,name:''},{num:111,name:''},{num:113,name:''}] },
    { name: 'EP 15', maps: [{num:115,name:''},{num:118,name:''},{num:120,name:''},{num:123,name:''}] },
]);

// ===== Boss Data =====
let bossList = load(KEYS.bossList, []);
let favs = load(KEYS.favs, []);
let nextId = parseInt(localStorage.getItem('appNextId') || '1');
function getNextId() { const id = nextId++; localStorage.setItem('appNextId', String(id)); return id; }
function saveBossList() { save(KEYS.bossList, bossList); }

// ===== Theme =====
const THEMES = ['theme-light','theme-kiro','theme-gold'];
const THEME_NAMES = ['☀️ Light','🌙 Kiro','✨ Gold'];
let themeIdx = THEMES.indexOf(load(KEYS.theme, 'theme-kiro'));
if (themeIdx < 0) themeIdx = 1;
document.body.className = THEMES[themeIdx];
document.getElementById('themeBtn').textContent = THEME_NAMES[themeIdx];
function cycleTheme() {
    themeIdx = (themeIdx + 1) % THEMES.length;
    document.body.className = THEMES[themeIdx];
    save(KEYS.theme, THEMES[themeIdx]);
    document.getElementById('themeBtn').textContent = THEME_NAMES[themeIdx];
}
// ===== EP Filter =====
let epFilter = load(KEYS.epFilter, null); // null = all
function renderEPFilter() {
    const el = document.getElementById('epFilter');
    const allActive = epFilter === null;
    let html = `<span class="ep-chip ${allActive?'active':''}" onclick="setEPFilter(null)">ทั้งหมด</span>`;
    config.forEach((ep, idx) => {
        const active = allActive || (epFilter && epFilter.includes(idx));
        html += `<span class="ep-chip ${active?'active':''}" onclick="toggleEP(${idx})">${ep.name}</span>`;
    });
    el.innerHTML = html;
}
function setEPFilter(v) { epFilter = v; save(KEYS.epFilter, epFilter); renderEPFilter(); render(); }
function toggleEP(idx) {
    if (epFilter === null) { epFilter = config.map((_,i)=>i).filter(i=>i!==idx); }
    else { const p = epFilter.indexOf(idx); if(p>=0) epFilter.splice(p,1); else epFilter.push(idx); if(epFilter.length>=config.length) epFilter=null; }
    save(KEYS.epFilter, epFilter); renderEPFilter(); render();
}
function isEPVisible(idx) { return epFilter === null || epFilter.includes(idx); }

// ===== View Mode =====
let viewMode = 'grid';
function toggleView() {
    viewMode = viewMode === 'grid' ? 'time' : 'grid';
    document.getElementById('viewBtn').textContent = viewMode === 'grid' ? '⊞ Grid' : '⏱ เวลา';
    render();
}

// ===== Helpers =====
function getNow() { return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Bangkok'})); }
function calcTime(v) {
    const d = new Date();
    if (v.includes('.')) { const [h,m]=v.split('.'); d.setHours(d.getHours()+parseInt(h)); d.setMinutes(d.getMinutes()+parseInt(m||0)); }
    else { d.setMinutes(d.getMinutes()+parseInt(v)); }
    return d.toISOString();
}
function formatElapsed(ms) {
    if (ms < 0) { const a=-ms; const s=Math.floor(a/1000); const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=s%60; return h>0?`-${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`-${m}:${String(sec).padStart(2,'0')}`; }
    const s=Math.floor(ms/1000); const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=s%60;
    return h>0?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${m}:${String(sec).padStart(2,'0')}`;
}
function fadeStars(fade) {
    let s=''; const full=Math.floor(fade); const half=(fade-full)>=0.3;
    for(let i=1;i<=4;i++){if(i<=full)s+='<span style="color:#f5c842;filter:drop-shadow(0 0 4px rgba(245,200,66,0.6))">★</span>';else if(i===full+1&&half)s+='<span style="color:#f5c842;opacity:0.6">☆</span>';else s+='<span style="opacity:0.2">★</span>';}
    return s;
}
function isFav(map,ch) { return favs.includes(`${map}-${ch}`); }
function toggleFav(map,ch) { const k=`${map}-${ch}`; const i=favs.indexOf(k); if(i>=0)favs.splice(i,1);else favs.push(k); save(KEYS.favs,favs); }
// ===== Render =====
function render() {
    const now = getNow();
    const el = document.getElementById('content');
    if (viewMode === 'grid') { renderGrid(el, now); } else { renderTime(el, now); }
}

function renderGrid(el, now) {
    let html = '';
    config.forEach((ep, epIdx) => {
        if (!isEPVisible(epIdx)) return;
        const items = bossList.filter(b => ep.maps.some(m => String(m.num) == String(b.MapNumber)));
        html += `<div class="grid-section"><div class="grid-header">☸ ${ep.name}</div><div class="grid-row">`;
        ep.maps.forEach(m => {
            const ch1 = items.find(b => String(b.MapNumber) == String(m.num) && b.Channel == 1);
            const item = ch1 || items.find(b => String(b.MapNumber) == String(m.num));
            if (!item) {
                // แมพว่าง — แสดงเลขจางๆ
                html += `<div style="min-width:0;"><div class="grid-cell gc-waiting" onclick="createBoss('${m.num}',1)"><div class="gc-map">${m.num}</div><div class="gc-fade" style="font-size:9px;">กดเพื่อเริ่ม</div></div></div>`;
                return;
            }
            const st = item.Status||'waiting'; const bt = new Date(item.TimeMer);
            const sc = st==='boss_on'?'gc-bosson':st==='dead'?'gc-dead':(item.Fade>=4)?'gc-fade4':(st==='active'||bt<=now)?'gc-active':'gc-waiting';
            const elapsed = now - bt;
            const timeStr = st!=='dead'&&st!=='boss_on' ? formatElapsed(elapsed) : (st==='boss_on'?'💀':'');
            const heart = isFav(item.MapNumber,item.Channel)?'❤️':'';
            const subs = items.filter(b => String(b.MapNumber)==String(m.num) && b.Channel>1);

            html += `<div style="min-width:0;">`;
            html += `<div class="grid-cell ${sc}" onclick="openBS('${item.MapNumber}',${item.Channel})">`;
            html += `${heart?`<span class="gc-heart">${heart}</span>`:''}`;
            html += `<div class="gc-map">${m.num}</div>`;
            html += `<div class="gc-stars">${fadeStars(item.Fade||0)}</div>`;
            html += `<div class="gc-fade">${item.Fade||0}</div>`;
            html += `<div class="gc-time" id="gt-${item.MapNumber}-${item.Channel}">${timeStr}</div>`;
            html += `</div>`;
            // Sub channels
            subs.forEach(sub => {
                const sst=sub.Status||'waiting'; const ssc=sst==='boss_on'?'gc-bosson':sst==='dead'?'gc-dead':sst==='active'?'gc-active':'gc-waiting';
                const se=now-new Date(sub.TimeMer); const st2=sst!=='dead'&&sst!=='boss_on'?formatElapsed(se):(sst==='boss_on'?'💀':'');
                html+=`<div class="grid-cell ${ssc}" onclick="openBS('${sub.MapNumber}',${sub.Channel})" style="margin-top:4px;min-height:55px;padding:4px 3px;">`;
                html+=`<div class="gc-map" style="font-size:11px;"><span style="opacity:0.4;font-size:8px;">CH</span> ${sub.Channel}</div>`;
                html+=`<div class="gc-stars" style="font-size:9px;">${fadeStars(sub.Fade||0)}</div>`;
                html+=`<div class="gc-time" id="gt-${sub.MapNumber}-${sub.Channel}" style="font-size:10px;">${st2}</div></div>`;
            });
            html += `<div class="grid-add" onclick="addCH('${m.num}')">+</div>`;
            html += `</div>`;
        });
        // fill empty columns
        for(let i=ep.maps.length;i<5;i++) html+='<div></div>';
        html += `</div></div>`;
    });
    el.innerHTML = html;
}
function renderTime(el, now) {
    const list = bossList.filter(b => {
        const epIdx = config.findIndex(ep => ep.maps.some(m => m.num == b.MapNumber));
        return isEPVisible(epIdx);
    }).sort((a,b) => {
        if(a.Status==='dead'&&b.Status!=='dead') return 1;
        if(a.Status!=='dead'&&b.Status==='dead') return -1;
        return new Date(a.TimeMer)-new Date(b.TimeMer);
    });
    if(list.length===0){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-faint);">ยังไม่มีข้อมูล</div>';return;}
    
    const tl1 = parseInt(localStorage.getItem('timeLine1') || '20');
    const tl2 = parseInt(localStorage.getItem('timeLine2') || '30');
    let div2Done=false, div1Done=false;
    
    let html='<div style="display:flex;gap:6px;margin-bottom:8px;align-items:center;font-size:11px;color:var(--text-muted);">⏱ เส้นเวลา: <input type="number" value="'+tl1+'" min="1" max="120" style="width:40px;padding:2px 4px;border:1px solid var(--border);border-radius:6px;background:var(--card-alt);color:var(--text);font-size:12px;text-align:center;" onchange="localStorage.setItem(\'timeLine1\',this.value);render()"> และ <input type="number" value="'+tl2+'" min="1" max="120" style="width:40px;padding:2px 4px;border:1px solid var(--border);border-radius:6px;background:var(--card-alt);color:var(--text);font-size:12px;text-align:center;" onchange="localStorage.setItem(\'timeLine2\',this.value);render()"> นาที</div>';
    html+='<table style="width:100%;border-collapse:separate;border-spacing:0 4px;"><tbody>';
    list.forEach(b=>{
        const st=b.Status||'waiting'; const bt=new Date(b.TimeMer); const elapsed=now-bt;
        // เส้นแบ่งเวลา
        if(st!=='boss_on'&&st!=='dead'&&elapsed>=0) {
            if(!div2Done && elapsed < tl2*60000) { html+=`<tr><td colspan="2" style="padding:10px 0;text-align:center;"><div style="display:flex;align-items:center;gap:10px;color:var(--accent);font-size:12px;font-weight:700;"><span style="flex:1;height:1px;background:var(--accent);"></span>⏱ เกิดมาแล้ว ${tl2} นาที<span style="flex:1;height:1px;background:var(--accent);"></span></div></td></tr>`; div2Done=true; }
            if(!div1Done && elapsed < tl1*60000) { html+=`<tr><td colspan="2" style="padding:10px 0;text-align:center;"><div style="display:flex;align-items:center;gap:10px;color:var(--accent);font-size:12px;font-weight:700;"><span style="flex:1;height:1px;background:var(--accent);"></span>⏱ เกิดมาแล้ว ${tl1} นาที<span style="flex:1;height:1px;background:var(--accent);"></span></div></td></tr>`; div1Done=true; }
        }
        const rc=st==='dead'?'gc-dead':st==='boss_on'?'gc-bosson':(st==='active'||bt<=now)?'gc-active':'gc-waiting';
        const timeStr=st!=='dead'&&st!=='boss_on'?formatElapsed(elapsed):(st==='boss_on'?'💀':'☠️');
        const epIdx=config.findIndex(ep=>ep.maps.some(m=>String(m.num)==String(b.MapNumber)));
        const epName=epIdx>=0?config[epIdx].name:'';
        // สีขอบซ้ายตาม status
        const borderLeft = st==='boss_on'?'3px solid var(--danger)':st==='dead'?'3px solid var(--purple)':(st==='active'||bt<=now)?'3px solid var(--accent)':'3px solid var(--border)';
        const rowOpacity = (st==='waiting'&&bt>now)?'opacity:0.4;':'';
        const bgColor = st==='boss_on'?'var(--danger-bg)':st==='dead'?'var(--purple-bg)':'var(--card)';
        const timeColor = elapsed<0?'var(--accent)':elapsed>20*60000?'var(--danger)':'var(--success)';
        html+=`<tr onclick="openBS('${b.MapNumber}',${b.Channel})" style="cursor:pointer;${rowOpacity}">`;
        html+=`<td style="padding:8px 12px;background:${bgColor};border:1px solid var(--border);border-left:${borderLeft};border-radius:10px 0 0 10px;"><strong style="font-size:15px;">${b.MapNumber}-${b.Channel}</strong><br><span style="font-size:9px;color:var(--text-faint);">${epName}</span></td>`;
        html+=`<td style="padding:8px 12px;background:${bgColor};border:1px solid var(--border);border-left:none;border-radius:0 10px 10px 0;text-align:center;"><span style="font-size:12px;">${fadeStars(b.Fade||0)}</span> <span style="font-size:10px;color:var(--text-muted);">${b.Fade||0}</span><br><span id="gt-${b.MapNumber}-${b.Channel}" style="font-size:13px;color:${timeColor};font-weight:700;">${timeStr}</span></td>`;
        html+=`</tr>`;
    });
    html+='</tbody></table>';
    el.innerHTML=html;
}

// ===== Create / Add =====
function createBoss(mapNum, ch) {
    const now = new Date().toISOString();
    bossList.push({ id:getNextId(), MapNumber:String(mapNum), Channel:ch, TimeMer:now, Fade:0, Status:'active', BossStartTime:null, UpdatedAt:now });
    saveBossList(); render();
}
function addCH(mapNum) {
    const maxCh = Math.max(...bossList.filter(b=>String(b.MapNumber)==String(mapNum)).map(b=>b.Channel), 0);
    createBoss(mapNum, maxCh+1);
}
// ===== Bottom Sheet =====
let bsMap=null, bsCh=null;
function openBS(map,ch) {
    bsMap=String(map); bsCh=ch;
    const item=bossList.find(b=>String(b.MapNumber)==bsMap&&b.Channel==ch);
    if(!item)return;
    const mapInfo=config.flatMap(e=>e.maps).find(m=>m.num==map);
    document.getElementById('bsTitle').textContent=`แมพ ${map} CH${ch}${mapInfo&&mapInfo.name?' — '+mapInfo.name:''}`;
    // Status
    const isBossOn=item.Status==='boss_on'; const fav=isFav(map,ch);
    let sh=`<div class="bs-status-wrap"><div class="bs-status-group">`;
    if(!isBossOn) sh+=`<button class="bs-btn bs-on" onclick="bsBossOn()" title="แจ้งบอสเกิดแล้ว">⚔️ Boss ON</button>`;
    sh+=`<button class="bs-btn bs-dead" onclick="bsDead()" title="แจ้งบอสตายแล้ว">☠️ ตาย</button>`;
    sh+=`</div><div class="bs-status-group">`;
    sh+=`<button class="bs-btn" onclick="bsReset()" title="เริ่มนับเวลาใหม่จากตอนนี้" style="border-color:var(--success);color:var(--success);">⏱️↺</button>`;
    sh+=`<button class="bs-btn" onclick="bsFav()" title="${fav?'เอาออกจากรายการถูกใจ':'เพิ่มในรายการถูกใจ'}" style="border-color:${fav?'#ff6b8a':'var(--border)'};color:${fav?'#ff6b8a':'var(--text-muted)'};">${fav?'❤️':'♡'}</button>`;
    sh+=`</div></div>`;
    document.getElementById('bsStatus').innerHTML=sh;
    // Stars — แบบฟันปลา: ดาวใหญ่สลับดาวเล็ก
    const curFade = item.Fade || 0;
    const allFades = [1, 1.5, 2, 2.5, 3, 3.5, 4];
    let starsHtml = '<div style="display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 0;">';
    allFades.forEach(f => {
        const big = Number.isInteger(f);
        const active = curFade >= f;
        const shift = big ? 'translateY(-8px)' : 'translateY(8px)';
        starsHtml += `<div class="bs-star" onclick="bsSetFade(${f})" style="transform:${shift};">
            <span class="star-icon ${big?'big':'small'} ${active?'active':''}">★</span>
            <span class="star-label">${f}</span>
        </div>`;
    });
    starsHtml += '</div>';
    document.getElementById('bsStars').innerHTML = starsHtml;
    // Time input
    document.getElementById('bsTimeInput').value='';
    // Delete
    document.getElementById('bsDeleteWrap').style.display=ch===1?'none':'block';
    // Open
    document.getElementById('bsOverlay').classList.add('open');
    document.getElementById('bottomSheet').classList.add('open');
    setTimeout(()=>document.getElementById('bsTimeInput').focus(),300);
}
function closeBS() { document.getElementById('bsOverlay').classList.remove('open'); document.getElementById('bottomSheet').classList.remove('open'); bsMap=null;bsCh=null; }

function bsBossOn() { const m=bsMap,c=bsCh; closeBS(); const item=bossList.find(b=>String(b.MapNumber)==m&&b.Channel==c); if(!item)return; item.Status='boss_on';item.Fade=4;item.BossStartTime=new Date().toISOString();item.UpdatedAt=new Date().toISOString(); saveBossList();render(); }
function bsDead() { const m=bsMap,c=bsCh; closeBS(); const item=bossList.find(b=>String(b.MapNumber)==m&&b.Channel==c); if(!item)return; item.Status='dead';item.BossStartTime=null;item.UpdatedAt=new Date().toISOString(); saveBossList();render(); }
function bsReset() { const m=bsMap,c=bsCh; closeBS(); const item=bossList.find(b=>String(b.MapNumber)==m&&b.Channel==c); if(!item)return; item.TimeMer=new Date().toISOString();item.Status='active';item.BossStartTime=null;item.UpdatedAt=new Date().toISOString(); saveBossList();render(); }
function bsFav() { if(!bsMap)return; toggleFav(bsMap,bsCh); openBS(bsMap,bsCh); }
function bsSetFade(f) { const m=bsMap,c=bsCh; closeBS(); const item=bossList.find(b=>String(b.MapNumber)==m&&b.Channel==c); if(!item)return; const wasDead=item.Status==='dead'; item.Fade=f;item.Status='active';item.UpdatedAt=new Date().toISOString(); if(wasDead)item.TimeMer=new Date().toISOString(); saveBossList();render(); }
function bsSetTime() { const v=document.getElementById('bsTimeInput').value.trim(); if(!v||!bsMap)return; const m=bsMap,c=bsCh; closeBS(); const item=bossList.find(b=>String(b.MapNumber)==m&&b.Channel==c); if(!item)return; item.TimeMer=calcTime(v);item.Status='waiting';item.Fade=0;item.BossStartTime=null;item.UpdatedAt=new Date().toISOString(); saveBossList();render(); }
function bsDelete() { const m=bsMap,c=bsCh; closeBS(); bossList=bossList.filter(b=>!(String(b.MapNumber)==m&&b.Channel==c)); saveBossList();render(); }
// ===== Setup Modal =====
function openSetup() {
    const el = document.getElementById('setupList');
    let html = '';
    config.forEach((ep, epIdx) => {
        html += `<div class="setup-ep"><div class="setup-ep-header"><input value="${ep.name}" onchange="config[${epIdx}].name=this.value"><button class="setup-btn" onclick="removeEP(${epIdx})" style="color:var(--danger);border-color:var(--danger);">ลบ EP</button></div>`;
        ep.maps.forEach((m, mIdx) => {
            html += `<div class="setup-map-row"><input class="map-num" type="text" value="${m.num}" onchange="config[${epIdx}].maps[${mIdx}].num=this.value.trim()"><input class="map-name" value="${m.name||''}" placeholder="ชื่อบอส" onchange="config[${epIdx}].maps[${mIdx}].name=this.value"><button class="setup-btn" onclick="removeMap(${epIdx},${mIdx})" style="color:var(--danger);">✕</button></div>`;
        });
        html += `<button class="setup-btn" onclick="addMap(${epIdx})">+ เพิ่มแมพ</button></div>`;
    });
    el.innerHTML = html;
    document.getElementById('setupModal').classList.add('open');
}
function closeSetup() { document.getElementById('setupModal').classList.remove('open'); }
function addEP() { config.push({name:`EP ${config.length+1}`,maps:[]}); openSetup(); }
function removeEP(idx) { if(confirm('ลบ EP นี้?')){config.splice(idx,1); openSetup();} }
function addMap(epIdx) { config[epIdx].maps.push({num:'',name:''}); openSetup(); }
function removeMap(epIdx,mIdx) { config[epIdx].maps.splice(mIdx,1); openSetup(); }
function saveSetup() { 
    // ตรวจเลขแมพซ้ำ
    const allNums = config.flatMap(ep => ep.maps.map(m => String(m.num).trim()));
    const dupes = allNums.filter((n, i) => n !== '' && allNums.indexOf(n) !== i);
    if (dupes.length > 0) {
        alert(`⚠️ เลขแมพซ้ำ: ${[...new Set(dupes)].join(', ')}\nกรุณาแก้ไขก่อนบันทึก`);
        return;
    }
    // ลบแมพที่ยังไม่ได้กรอกเลข
    config.forEach(ep => { ep.maps = ep.maps.filter(m => String(m.num).trim() !== ''); });
    // เรียง EP ตามเลขแมพแรกของแต่ละ EP
    const numPart = (s) => parseInt(String(s).replace(/\D/g,'')) || 999;
    config.sort((a,b) => {
        const aMin = a.maps.length ? Math.min(...a.maps.map(m=>numPart(m.num))) : 999;
        const bMin = b.maps.length ? Math.min(...b.maps.map(m=>numPart(m.num))) : 999;
        return aMin - bMin;
    });
    // เรียงแมพภายใน EP
    config.forEach(ep => { ep.maps.sort((a,b) => {
        const na = numPart(a.num), nb = numPart(b.num);
        if (na !== nb) return na - nb;
        return String(a.num).localeCompare(String(b.num));
    }); });
    save(KEYS.config, config); closeSetup(); renderEPFilter(); render(); 
}

// ===== Timer Update =====
setInterval(() => {
    const now = getNow();
    bossList.forEach(b => {
        const el = document.getElementById(`gt-${b.MapNumber}-${b.Channel}`);
        if (!el) return;
        const st = b.Status||'waiting';
        if (st==='dead'||st==='boss_on') return;
        const elapsed = now - new Date(b.TimeMer);
        el.textContent = formatElapsed(elapsed);
        // auto activate
        if (st==='waiting' && elapsed>=0) b.Status='active';
    });
}, 1000);

// ===== Init =====
renderEPFilter();
render();
</script>
